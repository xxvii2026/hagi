[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "forge-std/=node_modules/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
