name: Move mainnet ownership to the multisig
# Hands the mainnet vault and swap adapter from the deployer wallet to a Safe multisig. REAL and one-way:
# after this, only the Safe can pause, change limits or change the adapter.
# Runs only when contracts/deployments/request-owner changes on the contracts branch. That file holds the Safe address.
on:
  push:
    branches: [contracts]
    paths: ['contracts/deployments/request-owner']
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RPC: https://rpc.mainnet.chain.robinhood.com
      EXPECT_DEPLOYER: '0x595D766DBD9c72DFE66D55104e8Bef60F1983799'
      DEPLOYER_PRIVATE_KEY: ${{ secrets.MAINNET_DEPLOYER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Check the Safe, then transfer
        working-directory: contracts
        run: |
          set -euo pipefail
          SAFE=$(tr -d ' \n\r' < deployments/request-owner)
          V=$(jq -r .HagiVault deployments/mainnet.json); A=$(jq -r .HagiUniV3Adapter deployments/mainnet.json)
          echo "$SAFE" | grep -qE '^0x[0-9a-fA-F]{40}$' || { echo "request-owner must hold one address"; exit 1; }
          export DEPLOYER_PRIVATE_KEY="0x${DEPLOYER_PRIVATE_KEY#0x}"
          WHO=$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")
          [ "${WHO,,}" = "${EXPECT_DEPLOYER,,}" ] || { echo "Wrong key"; exit 1; }
          [ "$(cast chain-id --rpc-url $RPC)" = "4663" ] || { echo "Not Robinhood Chain mainnet"; exit 1; }
          # The new owner must be a real Safe on this chain with at least 2 signers needed. A wrong address here cannot be undone.
          CODE=$(cast code $SAFE --rpc-url $RPC); [ ${#CODE} -gt 10 ] || { echo "$SAFE has no contract on mainnet. Is the Safe created on Robinhood Chain?"; exit 1; }
          THRESHOLD=$(cast call $SAFE 'getThreshold()(uint256)' --rpc-url $RPC) || { echo "$SAFE is not a Safe"; exit 1; }
          OWNERS=$(cast call $SAFE 'getOwners()(address[])' --rpc-url $RPC)
          echo "Safe $SAFE needs $THRESHOLD signatures from: $OWNERS"
          [ "$THRESHOLD" -ge 2 ] || { echo "The Safe must need at least 2 signatures"; exit 1; }
          for C in $V $A; do
            NOW=$(cast call $C 'owner()(address)' --rpc-url $RPC)
            if [ "${NOW,,}" = "${SAFE,,}" ]; then echo "$C is already owned by the Safe"; continue; fi
            [ "${NOW,,}" = "${WHO,,}" ] || { echo "$C is owned by $NOW, not the deployer"; exit 1; }
            cast send $C 'transferOwnership(address)' $SAFE --private-key "$DEPLOYER_PRIVATE_KEY" --rpc-url $RPC | grep -E "status|transactionHash"
            AFTER=$(cast call $C 'owner()(address)' --rpc-url $RPC)
            [ "${AFTER,,}" = "${SAFE,,}" ] || { echo "Transfer of $C did not take"; exit 1; }
            echo "$C is now owned by the Safe"
          done
