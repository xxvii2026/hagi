name: Site check against testnet
on:
  push:
    branches: [status-check]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --silent
      - run: npx vite build
      - run: npm i --no-save --silent playwright@1.49.0 && npx playwright install --with-deps chromium > /dev/null
      - name: Sign in on the real testnet and watch every chain call
        run: |
          (npx vite preview --port 4173 > /tmp/pv.log 2>&1 &) ; sleep 4
          cat > check.mjs <<'JS'
          import { chromium } from 'playwright'
          import { privateKeyToAccount } from 'viem/accounts'
          const k = process.env.KEY.startsWith('0x') ? process.env.KEY : '0x' + process.env.KEY
          const acct = privateKeyToAccount(k)
          const RPC = 'https://rpc.testnet.chain.robinhood.com'
          const b = await chromium.launch(); const ctx = await b.newContext(); const pg = await ctx.newPage()
          await pg.exposeFunction('nodeSign', async hex => acct.signMessage({ message: { raw: hex } }))
          await pg.addInitScript(({ addr, RPC }) => {
            localStorage.setItem('hagi-tour-v1', '1'); let id = 0
            window.ethereum = { on() {}, removeListener() {}, request: async ({ method, params }) => {
              if (method === 'eth_requestAccounts' || method === 'eth_accounts') return [addr]
              if (method === 'wallet_switchEthereumChain' || method === 'wallet_addEthereumChain') return null
              if (method === 'personal_sign') return await window.nodeSign(params[0])
              const r = await fetch(RPC, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: ++id, method, params: params || [] }) })
              const j = await r.json(); if (j.error) throw Object.assign(new Error(j.error.message), { code: j.error.code }); return j.result } }
          }, { addr: acct.address, RPC })
          const logs = []; const bad = []; let n = 0
          pg.on('console', m => { if (['warning', 'error'].includes(m.type())) logs.push(m.type() + ': ' + m.text().slice(0, 600)) })
          pg.on('requestfailed', r => { if (r.url().includes('robinhood')) bad.push('FAILED ' + r.failure()?.errorText + ' ' + (r.postData() || '').slice(0, 200)) })
          pg.on('response', async r => { if (!r.url().includes('rpc.testnet')) return; n++; let body = ''; try { body = await r.text() } catch {}
            if (r.status() !== 200 || body.includes('"error"')) bad.push(r.status() + ' size=' + (r.request().postData() || '').length + ' req=' + (r.request().postData() || '').slice(0, 220) + ' -> ' + body.slice(0, 400)) })
          await pg.goto('http://localhost:4173/#/portfolio'); await pg.waitForTimeout(2500)
          await pg.click('.rt .wal'); await pg.waitForSelector('.modal.connect'); await pg.click('.modal.connect .btn')
          await pg.waitForTimeout(20000); const first = await pg.locator('.big').innerText().catch(() => '?'); console.log('AFTER 20s BAR:', await pg.locator('.net').innerText().catch(() => '?'), 'BALANCE:', first.replace(/\n/g, '')); const n0 = n; await pg.waitForTimeout(60000); console.log('RPC responses during 60s of background checks:', n - n0)
          console.log('ADDRESS', acct.address)
          console.log('TOP BAR SAYS:', await pg.locator('.net').innerText().catch(() => '?'))
          console.log('BALANCE:', (await pg.locator('.big').innerText().catch(() => '?')).replace(/\n/g, ''))
          console.log('RPC responses:', n)
          console.log('--- console'); logs.forEach(l => console.log(l))
          console.log('--- bad rpc responses'); bad.slice(0, 15).forEach(c => console.log(c))
          await b.close()
          JS
          node check.mjs
