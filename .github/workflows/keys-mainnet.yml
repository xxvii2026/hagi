name: Mainnet beta proving keys
# Makes fresh proving keys for the mainnet beta on a clean runner.
# Starts from the public perpetual powers-of-tau ceremony, adds two rounds of randomness from the runner
# that are never printed or saved, then a public beacon. The runner is destroyed afterwards.
# This is a single-operator setup, good for the capped team beta. A multi-person ceremony replaces it later.
on:
  workflow_dispatch:
  push:
    branches: [mainnet-beta]
    paths: ['.github/workflows/keys-mainnet.yml', 'circuits/transaction.circom']
jobs:
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build keys
        working-directory: circuits
        run: |
          set -euo pipefail
          npm ci
          mkdir -p build out
          npx circom2 transaction.circom --r1cs --wasm --sym -o build
          npx snarkjs r1cs info build/transaction.r1cs
          echo "r1cs sha256: $(sha256sum build/transaction.r1cs | cut -d' ' -f1)"
          for u in https://pse-trusted-setup-ppot.s3.eu-central-1.amazonaws.com/pot28_0080/ppot_0080_15.ptau https://hermez.s3-eu-west-1.amazonaws.com/powersOfTau28_hez_final_15.ptau https://storage.googleapis.com/zkevm/ptau/powersOfTau28_hez_final_15.ptau; do
            if curl -sSfL --max-time 300 -o build/hez15.ptau "$u"; then echo "ptau from $u"; break; fi
          done
          test -s build/hez15.ptau
          echo "ptau sha256: $(sha256sum build/hez15.ptau | cut -d' ' -f1)"
          # The file's hash is printed above so anyone can compare it with the published ceremony file.
          npx snarkjs groth16 setup build/transaction.r1cs build/hez15.ptau build/z0.zkey
          npx snarkjs zkey contribute build/z0.zkey build/z1.zkey --name="hagi beta runner 1" -e="$(head -c 96 /dev/urandom | xxd -p -c 400)" | grep -iE "hash|contribution" || true
          npx snarkjs zkey contribute build/z1.zkey build/z2.zkey --name="hagi beta runner 2" -e="$(head -c 96 /dev/urandom | xxd -p -c 400)$(date +%s%N)" | grep -iE "hash|contribution" || true
          BEACON=""
          for i in $(seq 1 12); do
            BEACON=$(cast block latest --json --rpc-url https://rpc.mainnet.chain.robinhood.com 2>/dev/null | jq -r '"\(.number) \(.hash)"' || true)
            case "$BEACON" in *0x*) break;; esac; BEACON=""; sleep 10
          done
          test -n "$BEACON"
          echo "beacon: Robinhood Chain block ${BEACON% *} hash ${BEACON#* }"
          BEACON=${BEACON#* }
          npx snarkjs zkey beacon build/z2.zkey build/transaction.zkey "${BEACON#0x}" 10 --name="hagi beta beacon"
          rm -f build/z0.zkey build/z1.zkey build/z2.zkey
          npx snarkjs zkey verify build/transaction.r1cs build/hez15.ptau build/transaction.zkey | tail -4
          npx snarkjs zkey export verificationkey build/transaction.zkey out/verification_key.json
          npx snarkjs zkey export solidityverifier build/transaction.zkey out/VerifierMainnet.sol
          sed -i 's/contract Groth16Verifier/contract Groth16VerifierMainnet/' out/VerifierMainnet.sol
          cp build/transaction.zkey out/transaction.zkey
          cp build/transaction_js/transaction.wasm out/transaction.wasm
          sha256sum out/*
      - name: Save the keys to the branch
        run: |
          mkdir -p public/zk/main
          cp circuits/out/transaction.zkey circuits/out/transaction.wasm circuits/out/verification_key.json public/zk/main/
          cp circuits/out/VerifierMainnet.sol contracts/src/VerifierMainnet.sol
          { echo "Hagi mainnet beta proving keys"; echo "made by GitHub Actions run $GITHUB_RUN_ID on $(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "single-operator setup on top of the public perpetual powers-of-tau ceremony (ppot_0080_15)"; (cd circuits/out && sha256sum *); } > circuits/mainnet-keys.txt
          git config user.name "hagi-keys"
          git config user.email "hagi-keys@users.noreply.github.com"
          git add public/zk/main contracts/src/VerifierMainnet.sol circuits/mainnet-keys.txt
          git commit -m "Mainnet beta proving keys and verifier (run $GITHUB_RUN_ID)"
          git push
