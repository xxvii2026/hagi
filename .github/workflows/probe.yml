name: Probe testnet
# Read-only checks against Robinhood Chain Testnet. Sends no transactions.
on:
  workflow_dispatch:
  push:
    branches: [contracts]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RPC: ${{ secrets.RPC_URL || 'https://rpc.testnet.chain.robinhood.com' }}
      EXP: https://explorer.testnet.chain.robinhood.com/api/v2
      DEPLOYER: '0xd16863014B75dfA19149E8db6078B17525021594'
      RELAYER: '0x56077D89f3179f061C9F436d2dF7623625898891'
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
    steps:
      - name: USDG icon sources
        run: |
          echo "mainnet-explorer $(curl -sS -m 20 https://robinhoodchain.blockscout.com/api/v2/tokens/0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168 | jq -r '"\(.symbol) \(.name) icon=\(.icon_url)"')"
          echo "coingecko $(curl -sS -m 20 'https://api.coingecko.com/api/v3/coins/global-dollar?localization=false&tickers=false&market_data=false&community_data=false&developer_data=false' | jq -r '"\(.symbol) \(.name) \(.image.large)"')"
          for u in https://cdn.jsdelivr.net/gh/trustwallet/assets@master/blockchains/ethereum/assets/0xe343167631d89B6Ffc58B88d6b7fB0228795491D/logo.png https://cdn.jsdelivr.net/gh/nvstly/icons@main/crypto_icons/USDG.png https://cdn.jsdelivr.net/gh/nvstly/icons@main/ticker_icons/USDG.png; do
            echo "cand $u -> $(curl -sS -o /dev/null -L -m 15 -w '%{http_code} %{content_type} %{size_download}' "$u")"
          done
