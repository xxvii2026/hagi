name: Probe testnet
# Read-only checks against Robinhood Chain Testnet. Sends no transactions.
on:
  workflow_dispatch:
  push:
    branches: [contracts]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RPC: ${{ secrets.RPC_URL || 'https://rpc.testnet.chain.robinhood.com' }}
      EXP: https://explorer.testnet.chain.robinhood.com/api/v2
      DEPLOYER: '0xd16863014B75dfA19149E8db6078B17525021594'
      RELAYER: '0x56077D89f3179f061C9F436d2dF7623625898891'
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
    steps:
      - name: Why the wallet history fails
        run: |
          T='["0x48fdc557DE6Fe7efD3341e6c28A626Be021d117a","0xC9f9c86933092BbbfFF3CCb4b105A4A94bf3Bd4E","0x71178BAc73cBeb415514eB542a8995b82669778d","0x5884aD2f920c162CFBbACc88C9C51AA75eC09E02","0x3b8262A63d25f0477c4DDE23F83cfe22Cb768C93","0x1FBE1a0e43594b3455993B5dE5Fd0A7A266298d0"]'
          TOPIC=0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef
          PAD=0x000000000000000000000000$(echo ${DEPLOYER#0x} | tr A-F a-f)
          L=$(curl -sS -m 20 -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' $RPC | jq -r .result); echo "latest $L = $((L))"
          for SPAN in 9500000 2000000 500000 100000; do
            F=$(printf '0x%x' $(( L - SPAN )))
            START=$(date +%s.%N)
            R=$(curl -sS -m 60 -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getLogs\",\"params\":[{\"address\":$T,\"topics\":[\"$TOPIC\",\"$PAD\"],\"fromBlock\":\"$F\",\"toBlock\":\"$L\"}]}" $RPC)
            END=$(date +%s.%N)
            echo "span $SPAN: $(echo "$END - $START" | bc)s  logs=$(echo "$R" | jq '.result | length' 2>/dev/null)  error=$(echo "$R" | jq -c '.error' 2>/dev/null | head -c 300)"
          done
          echo "== deploy block of the vault, for scale: 154069900"
          echo "== blockscout token transfers, with an Origin header to see CORS"
          curl -sS -m 30 -D /tmp/h -o /tmp/b -H 'Origin: https://hagi-git-landing-demo-xxvii1.vercel.app' "$EXP/addresses/$DEPLOYER/token-transfers?type=ERC-20"
          grep -i 'access-control\|^HTTP' /tmp/h
          jq -r '.items[:6][]? | "\(.timestamp) \(.token.symbol) \(.from.hash[0:8])->\(.to.hash[0:8]) \(.total.value)"' /tmp/b
          echo "next page: $(jq -c '.next_page_params' /tmp/b)"
          echo "== token balances endpoint"
          curl -sS -m 30 "$EXP/addresses/$DEPLOYER/token-balances" | jq -r '.[:8][]? | "\(.token.symbol) \(.value)"'
