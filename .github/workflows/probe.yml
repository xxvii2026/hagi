name: Probe testnet
# Read-only checks against Robinhood Chain Testnet. Sends no transactions.
on:
  workflow_dispatch:
  push:
    branches: [contracts]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RPC: ${{ secrets.RPC_URL || 'https://rpc.testnet.chain.robinhood.com' }}
      EXP: https://explorer.testnet.chain.robinhood.com/api/v2
      DEPLOYER: '0xd16863014B75dfA19149E8db6078B17525021594'
      RELAYER: '0x56077D89f3179f061C9F436d2dF7623625898891'
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
    steps:
      - name: Token icons
        run: |
          for a in 0xC9f9c86933092BbbfFF3CCb4b105A4A94bf3Bd4E 0x71178BAc73cBeb415514eB542a8995b82669778d 0x5884aD2f920c162CFBbACc88C9C51AA75eC09E02 0x3b8262A63d25f0477c4DDE23F83cfe22Cb768C93 0x1FBE1a0e43594b3455993B5dE5Fd0A7A266298d0; do
            curl -sS "$EXP/tokens/$a" | jq -r '"explorer \(.symbol) icon=\(.icon_url)"'
          done
          for u in https://financialmodelingprep.com/image-stock/TSLA.png https://assets.parqet.com/logos/symbol/TSLA https://images.financialmodelingprep.com/symbol/TSLA.png https://static2.finnhub.io/file/publicdatany/finnhubimage/stock_logo/TSLA.png https://storage.googleapis.com/iexcloud-hl37opg/api/logos/TSLA.png https://cdn.jsdelivr.net/gh/nvstly/icons@main/ticker_icons/TSLA.png https://raw.githubusercontent.com/nvstly/icons/main/ticker_icons/TSLA.png; do
            echo "cand $u -> $(curl -sS -o /dev/null -L -m 15 -H 'Origin: https://hagi.example' -H 'Referer: https://hagi.example/' -w '%{http_code} %{content_type} %{size_download}' "$u")"
          done
          for s in TSLA AMD AMZN NFLX PLTR; do echo "nvstly $s -> $(curl -sS -o /dev/null -L -m 15 -w '%{http_code} %{content_type} %{size_download}' https://cdn.jsdelivr.net/gh/nvstly/icons@main/ticker_icons/$s.png)"; done
