name: Probe testnet
# Read-only checks against Robinhood Chain Testnet. Sends no transactions.
on:
  workflow_dispatch:
  push:
    branches: [contracts]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RPC: ${{ secrets.RPC_URL || 'https://rpc.testnet.chain.robinhood.com' }}
      EXP: https://explorer.testnet.chain.robinhood.com/api/v2
      DEPLOYER: '0xd16863014B75dfA19149E8db6078B17525021594'
      RELAYER: '0x56077D89f3179f061C9F436d2dF7623625898891'
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
    steps:
      - name: RPC batching and rate limits
        run: |
          echo "batch -> $(curl -sS -m 20 -X POST $RPC -H 'content-type: application/json' -d '[{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]},{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}]' | head -c 200)"
          ok=0; bad=0; for i in $(seq 1 40); do c=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' -X POST $RPC -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}'); [ "$c" = "200" ] && ok=$((ok+1)) || { bad=$((bad+1)); echo "status $c on request $i"; }; done; echo "burst of 40: ok=$ok bad=$bad"
          curl -sS -m 10 -i -X POST $RPC -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' | grep -iE "ratelimit|retry-after|^HTTP" | head -5
          echo "relayer ETH: $(curl -sS -m 10 -X POST $RPC -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_getBalance","params":["0x56077D89f3179f061C9F436d2dF7623625898891","latest"]}' | head -c 120)"
          echo "relayer nonce: $(curl -sS -m 10 -X POST $RPC -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_getTransactionCount","params":["0x56077D89f3179f061C9F436d2dF7623625898891","latest"]}' | head -c 120)"
