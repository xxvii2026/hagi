name: Deploy to testnet
# Runs only when contracts/deployments/request-testnet changes on the contracts branch,
# so a deployment is always a deliberate, visible commit.
on:
  push:
    branches: [contracts]
    paths: ['contracts/deployments/request-testnet']
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      RPC: ${{ secrets.RPC_URL || 'https://rpc.testnet.chain.robinhood.com' }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - name: Test
        run: forge test
      - name: Deploy and seed
        run: forge script script/Deploy.s.sol:Deploy --rpc-url "$RPC" --broadcast --slow --gas-estimate-multiplier 150
      - name: Verify on the explorer
        continue-on-error: true
        run: forge script script/Deploy.s.sol:Deploy --rpc-url "$RPC" --resume --verify --verifier blockscout --verifier-url https://explorer.testnet.chain.robinhood.com/api/
      - name: Deployer balance after
        run: echo "deployer ETH left $(cast from-wei $(cast balance 0xd16863014B75dfA19149E8db6078B17525021594 --rpc-url $RPC))"
